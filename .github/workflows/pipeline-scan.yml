name: Pipeline Security Scan

on:
  workflow_call:
    outputs:
      scan-result:
        description: "Pipeline scan result"
        value: ${{ jobs.pipeline-scan.outputs.result }}

  # 🚧 REPLACE THIS ENTIRE 'jobs:' SECTION WITH WORKSHOP CONTENT! 🚧
  # Copy from: workshop/pipeline_scan/{tool}/workflow.yml

  
jobs:
  zizmor:
    name: Run zizmor 🌈
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read # only needed for private repos
      actions: read # only needed for private repos
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        id: zizmor
        uses: zizmorcore/zizmor-action@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          min-severity: "high"
          # Disable online audits — they hard-crash the run on any GitHub API HTTP error
          # (see zizmor#1252 / #1874).
          online-audits: "false"

      - name: Summarize findings
        if: always() && steps.zizmor.outputs.output-file != ''
        run: |
          SARIF="${{ steps.zizmor.outputs.output-file }}"
          COUNT=$(jq '[.runs[].results[]] | length' "$SARIF")
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "✅ No security alerts"
          else
            echo "❌ Found $COUNT zizmor finding(s):"
            jq -r '.runs[].results[] |
              "  - \(.ruleId) | \(.message.text)\n      \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // 1)"' \
              "$SARIF"
            exit 1
          fi
  
  secrets-scan:
    name: Secrets Scan with TruffleHog
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.scan-result.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog secrets scanner
        id: scan-tool
        run: |
          # Install TruffleHog
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

          # Use --json so the next step can produce a uniform "Summarize findings"
          # report (same shape as the other workshop modules).
          # Include `unverified` so detected-but-unverifiable secrets still fail the build
          # (the workshop's didactic AKIA is invalid and would otherwise be silently dropped).
          trufflehog filesystem . --results=verified,unknown,unverified --json > trufflehog.json

          if [ -s trufflehog.json ]; then
            exit 1
          fi

      - name: Summarize findings
        if: always() && hashFiles('trufflehog.json') != ''
        run: |
          REPORT=trufflehog.json
          if [ ! -s "$REPORT" ]; then
            echo "✅ No security alerts"
          else
            COUNT=$(jq -s 'length' "$REPORT")
            echo "❌ Found $COUNT TruffleHog finding(s):"
            jq -r '"  - \(.DetectorName) | verified=\(.Verified)\n      \(.SourceMetadata.Data.Filesystem.file):\(.SourceMetadata.Data.Filesystem.line // 1)"' "$REPORT"
          fi

      - name: Set scan result
        id: scan-result
        if: always()
        run: |
          if [ "${{ steps.scan-tool.outcome }}" == "success" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "✅ Secrets scan passed - no secrets detected"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "❌ Secrets scan failed - secrets detected in repository"
            exit 1
          fi
