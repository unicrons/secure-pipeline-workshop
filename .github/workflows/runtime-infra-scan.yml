name: Runtime Security Testing

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to test"
        required: true
        type: string
      app-url:
        description: "Application URL to test"
        required: true
        type: string
    secrets:
      AWS_IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for authentication"
        required: false
    outputs:
      runtime-infra-scan-result:
        description: "Runtime infrastructure scan result"
        value: ${{ jobs.runtime-infra-scan.outputs.result }}

jobs:
  runtime-infra-scan:
    name: Runtime Infrastructure Scan with Prowler
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.scan-result.outputs.result }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
            role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
            role-session-name: ProwlerSession
            aws-region: ${{ vars.AWS_REGION }}
            role-duration-seconds: ${{ vars.AWS_IAM_ROLE_SESSION_DURATION }}
            mask-aws-account-id: true

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install Prowler
        env:
          PYTHON_BIN: ${{ steps.python.outputs.python-path }}
        run: |
            # Prowler supports Python >=3.10,<3.14. Pin the interpreter and require v5+ so pip
            # can't silently fall back to an ancient release on a newer runner Python.
            pipx install --python "$PYTHON_BIN" 'prowler>=5'
            prowler -v

      - name: Run Prowler
        id: prowler
        run: |
            prowler aws --service iam s3 --output-formats html -z
        continue-on-error: true

      - name: Message
        run: |
            echo "Prowler run completed"

      - name: Upload Prowler HTML Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prowler-html-report
          path: output/*.html
          retention-days: 3

      - name: Summarize findings
        if: always()
        run: |
          if [ "${{ steps.prowler.outcome }}" == "success" ]; then
            echo "✅ No security alerts"
          else
            echo "❌ Prowler detected runtime infrastructure security issues."
            echo "🔍 View findings: download the 'prowler-html-report' artifact from this run (Artifacts section at the top of the run page)."
          fi

      - name: Set scan result
        id: scan-result
        if: always()
        run: |
          if [ "${{ steps.prowler.outcome }}" == "success" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "✅ Pipeline scan passed"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "❌ Pipeline scan failed"
          fi

