name: Pipeline Security Scan

on:
  workflow_call:
    outputs:
      scan-result:
        description: "Pipeline scan result"
        value: ${{ jobs.pipeline-scan.outputs.result }}

jobs:
  pipeline-scan:
    name: Run zizmor 🌈
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read # only needed for private repos
      actions: read # only needed for private repos
    outputs:
      result: ${{ steps.scan-result.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        id: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          min-severity: "high"
          # Disable online audits — they hard-crash the run on any GitHub API HTTP error
          # (see zizmor#1252 / #1874).
          online-audits: "false"

      - name: Summarize findings
        id: summarize
        if: always() && steps.zizmor.outputs.output-file != ''
        run: |
          SARIF="${{ steps.zizmor.outputs.output-file }}"
          COUNT=$(jq '[.runs[].results[]] | length' "$SARIF")
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "✅ No security alerts"
          else
            echo "❌ Found $COUNT zizmor finding(s):"
            jq -r '.runs[].results[] |
              "  - \(.ruleId) | \(.message.text)\n      \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // 1)"' \
              "$SARIF"
            exit 1
          fi

      - name: Set scan result
        id: scan-result
        if: always()
        run: |
          if [ "${{ steps.zizmor.outcome }}" == "success" ] && [ "${{ steps.summarize.outcome }}" != "failure" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "✅ Pipeline scan passed - no security issues detected"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "❌ Pipeline scan failed - security issues detected in workflows"
            exit 1
          fi
